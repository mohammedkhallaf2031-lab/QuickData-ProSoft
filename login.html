<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>تسجيل الدخول - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5a623;
            --gold-light: #ffc857;
            --gold-deep: #e08e0b;
            --navy-bg: #1b2431;
            --navy-bg-2: #141c27;
            --card: #212c3b;
            --field: #2a3646;
            --field-border: #37455a;
            --text-dim: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.4);
            --text-mid: rgba(255, 255, 255, 0.72);
            --danger: #ff6b6b;
            --success: #66d17d;
        }

        html {
            scroll-behavior: smooth;
            background: var(--navy-bg-2);
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            position: relative;
            background: radial-gradient(ellipse at 50% 40%, #232f40 0%, var(--navy-bg) 55%, var(--navy-bg-2) 100%);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border-radius: 22px;
            padding: 38px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 22px rgba(245, 166, 35, 0.35);
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-mid);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: var(--field);
            border: 1px solid var(--field-border);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.18);
        }
        .input-wrap .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            z-index: 2;
            display: flex;
            pointer-events: none;
        }
        .input-wrap:focus-within .input-icon {
            color: var(--gold);
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            text-align: right;
        }
        .input-wrap input::placeholder {
            color: var(--text-faint);
            font-weight: 400;
        }
        .input-wrap.has-toggle input {
            padding: 14px 44px 14px 44px;
        }

        .toggle-pass {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            z-index: 3;
            padding: 6px;
            display: flex;
            border-radius: 6px;
        }
        .toggle-pass:hover {
            color: var(--gold);
        }

        .field-error {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--danger);
            font-size: 0.74rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .field-error.show {
            display: flex;
        }
        .input-wrap.invalid {
            border-color: var(--danger);
        }
        .input-wrap.invalid:focus-within {
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }

        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            gap: 12px;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
        }
        .remember label {
            font-size: 0.78rem;
            color: var(--text-mid);
            cursor: pointer;
        }
        .forgot a {
            color: var(--text-mid);
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
        }
        .forgot a:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
            color: #1b1204;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, opacity 0.25s;
            font-family: inherit;
            box-shadow: 0 10px 26px rgba(245, 166, 35, 0.28);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(245, 166, 35, 0.36);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }
        .btn-primary:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            box-shadow: none;
        }

        .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(27, 18, 4, 0.3);
            border-top-color: #1b1204;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-primary.loading .btn-spinner {
            display: inline-block;
        }
        .btn-primary.loading .btn-label {
            opacity: 0.85;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.82rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }
        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.14);
            color: var(--success);
            border: 1px solid rgba(43, 138, 62, 0.25);
        }
        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.12);
            color: var(--danger);
            border: 1px solid rgba(201, 42, 42, 0.22);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .links {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 20px;
        }
        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 800;
        }
        .links a:hover {
            text-decoration: underline;
            color: var(--gold-light);
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.22);
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        .copyright strong {
            color: rgba(245, 166, 35, 0.45);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px 24px;
                border-radius: 20px;
            }
            .title {
                font-size: 1.6rem;
            }
        }
        @media (max-width: 480px) and (max-height: 700px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="title">تسجيل الدخول</h1>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrap" id="emailWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2" />
                            <path d="m22 6-10 7L2 6" />
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="admin@company.com" required autocomplete="email" />
                </div>
                <div class="field-error" id="emailError">⚠ يرجى إدخال بريد إلكتروني صالح</div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrap has-toggle" id="passwordWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
                    <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">
                        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="field-error" id="passwordError">⚠ يرجى إدخال كلمة المرور</div>
            </div>

            <div class="options-row">
                <div class="remember">
                    <input type="checkbox" id="remember" name="remember" />
                    <label for="remember">تذكرني</label>
                </div>
                <div class="forgot">
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">دخول</span>
            </button>

            <div id="message" class="message" role="status"></div>
        </form>

        <div class="links">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a>
        </div>

        <div class="copyright">
            © 2026 جميع الحقوق محفوظة لـ <strong>QuickData ProSoft</strong>
        </div>
    </div>

    <script>
        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        var togglePass = document.getElementById('togglePass');
        var passwordInput = document.getElementById('password');
        var eyeIcon = document.getElementById('eyeIcon');
        var eyeOpenPath = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
        var eyeClosedPath = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>';

        togglePass.addEventListener('click', function() {
            var isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
        });

        // ============================================================
        // LOGIN FORM
        // ============================================================
        var loginForm = document.getElementById('loginForm');
        var messageDiv = document.getElementById('message');
        var emailInput = document.getElementById('email');
        var emailWrap = document.getElementById('emailWrap');
        var emailError = document.getElementById('emailError');
        var passwordWrap = document.getElementById('passwordWrap');
        var passwordError = document.getElementById('passwordError');
        var loginBtn = document.getElementById('loginBtn');
        var btnLabel = loginBtn.querySelector('.btn-label');

        function validateEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function setFieldState(wrap, errorEl, isValid) {
            wrap.classList.toggle('invalid', !isValid);
            errorEl.classList.toggle('show', !isValid);
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = emailInput.value.trim();
            var password = passwordInput.value.trim();

            var emailValid = validateEmail(email);
            var passwordValid = password.length > 0;

            setFieldState(emailWrap, emailError, emailValid);
            setFieldState(passwordWrap, passwordError, passwordValid);

            if (!emailValid || !passwordValid) {
                if (!emailValid) emailInput.focus();
                else passwordInput.focus();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            btnLabel.textContent = 'جاري التحقق...';
            messageDiv.className = 'message';
            messageDiv.innerHTML = '';

            try {
                var response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                var data = await response.json();

                if (!response.ok) {
                    var errorMsg = data.msg || data.message || 'بيانات الدخول غير صحيحة';
                    throw new Error(errorMsg);
                }

                var storage = document.getElementById('remember').checked ? window.localStorage : window.sessionStorage;
                storage.setItem('rollex_session', JSON.stringify({
                    access_token: data.access_token,
                    refresh_token: data.refresh_token,
                    expires_at: Date.now() + (data.expires_in * 1000)
                }));

                messageDiv.className = 'message success';
                messageDiv.innerHTML = '✅ تم تسجيل الدخول بنجاح! جاري التحويل...';

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 900);

            } catch (error) {
                console.error('❌ خطأ:', error);
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '⚠ ' + error.message;
            }

            loginBtn.disabled = false;
            loginBtn.classList.remove('loading');
            btnLabel.textContent = 'دخول';
        });

        // ============================================================
        // SESSION CHECK
        // ============================================================
        (async function() {
            var token = getToken();
            if (token) {
                try {
                    var response = await fetch(SUPABASE_URL + '/auth/v1/user', {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + token
                        }
                    });
                    if (response.ok) {
                        window.location.href = 'index.html';
                        return;
                    }
                } catch (e) {}
            }
            console.log('👤 صفحة تسجيل الدخول');
        })();
    </script>

</body>
</html>
