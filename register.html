<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>إنشاء حساب - QuickData ProSoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.loading {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        body.ready {
            opacity: 1;
            pointer-events: auto;
        }

        :root {
            --gold: #f5a623;
            --gold-light: #ffc857;
            --gold-deep: #e08e0b;
            --navy-bg: #1b2431;
            --navy-bg-2: #141c27;
            --card: #212c3b;
            --field: #2a3646;
            --field-border: #37455a;
            --text-dim: rgba(255, 255, 255, 0.55);
            --text-faint: rgba(255, 255, 255, 0.4);
            --text-mid: rgba(255, 255, 255, 0.72);
            --danger: #ff6b6b;
            --success: #66d17d;
        }

        html {
            scroll-behavior: smooth;
            background: var(--navy-bg-2);
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
            direction: rtl;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            position: relative;
            background: radial-gradient(ellipse at 50% 40%, #232f40 0%, var(--navy-bg) 55%, var(--navy-bg-2) 100%);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .register-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border-radius: 22px;
            padding: 38px 30px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .title {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 22px rgba(245, 166, 35, 0.35);
            margin-bottom: 26px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-mid);
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: var(--field);
            border: 1px solid var(--field-border);
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.18);
        }
        .input-wrap .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            z-index: 2;
            display: flex;
            pointer-events: none;
        }
        .input-wrap:focus-within .input-icon { color: var(--gold); }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            text-align: right;
        }
        .input-wrap input::placeholder { color: var(--text-faint); font-weight: 400; }

        .input-wrap .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            z-index: 2;
            font-size: 0.9rem;
            padding: 4px;
            transition: color 0.2s;
        }
        .input-wrap .toggle-password:hover { color: var(--gold); }

        .field-error {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--danger);
            font-size: 0.74rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .field-error.show { display: flex; }
        .input-wrap.invalid { border-color: var(--danger); }
        .input-wrap.invalid:focus-within { box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-deep));
            color: #1b1204;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, opacity 0.25s;
            font-family: inherit;
            box-shadow: 0 10px 26px rgba(245, 166, 35, 0.28);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(245, 166, 35, 0.36);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .btn-primary:disabled { cursor: not-allowed; opacity: 0.75; box-shadow: none; }

        .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(27, 18, 4, 0.3);
            border-top-color: #1b1204;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-primary.loading .btn-spinner { display: inline-block; }
        .btn-primary.loading .btn-label { opacity: 0.85; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .message {
            text-align: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 14px;
            font-size: 0.82rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }
        .message.success {
            display: flex;
            background: rgba(43, 138, 62, 0.14);
            color: var(--success);
            border: 1px solid rgba(43, 138, 62, 0.25);
        }
        .message.error {
            display: flex;
            background: rgba(201, 42, 42, 0.12);
            color: var(--danger);
            border: 1px solid rgba(201, 42, 42, 0.22);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .checkmark { width: 16px; height: 16px; flex-shrink: 0; }
        .checkmark circle { stroke: var(--success); stroke-width: 2; fill: none; }
        .checkmark path { stroke: var(--success); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        .links {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 20px;
        }
        .links a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 800;
        }
        .links a:hover { text-decoration: underline; color: var(--gold-light); }

        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.22);
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        .copyright strong { color: rgba(245, 166, 35, 0.45); }

        @media (max-width: 480px) {
            .register-container { padding: 30px 22px 24px; border-radius: 20px; }
            .title { font-size: 1.6rem; }
        }
        @media (max-width: 480px) and (max-height: 700px) {
            body { align-items: flex-start; padding-top: 20px; }
        }
    </style>
</head>
<body class="loading">

    <div class="register-container">
        <h1 class="title">إنشاء حساب</h1>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name">الاسم الكامل</label>
                <div class="input-wrap" id="nameWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="name" name="name" placeholder="أحمد محمد المدير" required autocomplete="name" />
                </div>
                <div class="field-error" id="nameError">⚠ يرجى إدخال الاسم الكامل</div>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrap" id="emailWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                    </span>
                    <input type="email" id="email" name="email" placeholder="admin@company.com" required autocomplete="email" />
                </div>
                <div class="field-error" id="emailError">⚠ يرجى إدخال بريد إلكتروني صالح</div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrap" id="passwordWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="•••••••• (6 أحرف على الأقل)" required minlength="6" autocomplete="new-password" />
                    <button type="button" class="toggle-password" id="togglePassword">👁</button>
                </div>
                <div class="field-error" id="passwordError">⚠ كلمة المرور يجب أن تكون 6 أحرف على الأقل</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور</label>
                <div class="input-wrap" id="confirmPasswordWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="أعد كتابة كلمة المرور" required minlength="6" autocomplete="new-password" />
                    <button type="button" class="toggle-password" id="toggleConfirmPassword">👁</button>
                </div>
                <div class="field-error" id="confirmPasswordError">⚠ كلمة المرور غير متطابقة</div>
            </div>

            <div class="form-group">
                <label for="companyName">اسم الشركة</label>
                <div class="input-wrap" id="companyWrap">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M16 18h.01"/></svg>
                    </span>
                    <input type="text" id="companyName" name="companyName" placeholder="شركة النور للتجارة" required autocomplete="organization" />
                </div>
                <div class="field-error" id="companyError">⚠ يرجى إدخال اسم الشركة</div>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label">إنشاء الحساب</span>
            </button>

            <div id="message" class="message" role="status"></div>
        </form>

        <div class="links">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>

        <div class="copyright">
            © 2026 جميع الحقوق محفوظة لـ <strong>QuickData ProSoft</strong>
        </div>
    </div>

    <script>
        // ============================================================
        // TOGGLE PASSWORD
        // ============================================================
        function setupTogglePassword(inputId, toggleId) {
            var input = document.getElementById(inputId);
            var toggle = document.getElementById(toggleId);
            toggle.addEventListener('click', function() {
                var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁' : '🙈';
            });
        }
        setupTogglePassword('password', 'togglePassword');
        setupTogglePassword('confirmPassword', 'toggleConfirmPassword');

        // ============================================================
        // REGISTER FORM
        // ============================================================
        var registerForm = document.getElementById('registerForm');
        var messageDiv = document.getElementById('message');
        var registerBtn = document.getElementById('registerBtn');
        var btnLabel = registerBtn.querySelector('.btn-label');

        var nameInput = document.getElementById('name');
        var nameWrap = document.getElementById('nameWrap');
        var nameError = document.getElementById('nameError');

        var emailInput = document.getElementById('email');
        var emailWrap = document.getElementById('emailWrap');
        var emailError = document.getElementById('emailError');

        var passwordInput = document.getElementById('password');
        var passwordWrap = document.getElementById('passwordWrap');
        var passwordError = document.getElementById('passwordError');

        var confirmPasswordInput = document.getElementById('confirmPassword');
        var confirmPasswordWrap = document.getElementById('confirmPasswordWrap');
        var confirmPasswordError = document.getElementById('confirmPasswordError');

        var companyInput = document.getElementById('companyName');
        var companyWrap = document.getElementById('companyWrap');
        var companyError = document.getElementById('companyError');

        function validateEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function setFieldState(wrap, errorEl, isValid) {
            wrap.classList.toggle('invalid', !isValid);
            errorEl.classList.toggle('show', !isValid);
        }

        confirmPasswordInput.addEventListener('input', function() {
            var password = passwordInput.value;
            var confirm = this.value;
            if (confirm.length > 0) {
                var isValid = password === confirm;
                setFieldState(confirmPasswordWrap, confirmPasswordError, isValid);
            } else {
                confirmPasswordWrap.classList.remove('invalid');
                confirmPasswordError.classList.remove('show');
            }
        });

        passwordInput.addEventListener('input', function() {
            if (confirmPasswordInput.value.length > 0) {
                var isValid = this.value === confirmPasswordInput.value;
                setFieldState(confirmPasswordWrap, confirmPasswordError, isValid);
            }
        });

        // ============================================================
        // CREATE COMPANY
        // ============================================================
        async function createCompany(companyName) {
            var response = await fetch(SUPABASE_URL + '/rest/v1/companies', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    name: companyName,
                    subdomain: companyName.toLowerCase().replace(/[^a-z0-9]/g, '') + '-' + Date.now().toString().slice(-6),
                    trial_start_date: new Date().toISOString().split('T')[0],
                    trial_end_date: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    subscription_status: 'trial',
                    max_users: 5
                })
            });
            if (!response.ok) {
                var errorText = await response.text();
                throw new Error('فشل إنشاء الشركة: ' + errorText);
            }
            var data = await response.json();
            return data && data.length > 0 ? data[0] : null;
        }

        // ============================================================
        // CREATE PROFILE
        // ============================================================
        async function createProfile(userId, name, email, companyId, companyName, role) {
            var token = getToken();
            if (!token) throw new Error('لا يوجد توكن');

            var response = await fetch(SUPABASE_URL + '/rest/v1/profiles', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({
                    id: userId,
                    name: name,
                    email: email,
                    role: role || 'admin',
                    company_id: companyId,
                    company_name: companyName,
                    is_active: true
                })
            });

            if (!response.ok) {
                var errorText = await response.text();
                throw new Error('فشل إنشاء البروفايل: ' + errorText);
            }

            return await response.json();
        }

        // ============================================================
        // DELETE COMPANY (للتراجع)
        // ============================================================
        async function deleteCompany(companyId) {
            var token = getToken();
            if (!token) return;

            await fetch(SUPABASE_URL + '/rest/v1/companies?id=eq.' + companyId, {
                method: 'DELETE',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + token
                }
            });
        }

        // ============================================================
        // SUBMIT FORM - مع نظام التراجع (Rollback)
        // ============================================================
        registerForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (registerBtn.disabled) return;

            var name = nameInput.value.trim();
            var email = emailInput.value.trim();
            var password = passwordInput.value;
            var confirmPassword = confirmPasswordInput.value;
            var companyName = companyInput.value.trim();

            var nameValid = name.length > 0;
            var emailValid = validateEmail(email);
            var passwordValid = password.length >= 6;
            var confirmValid = password === confirmPassword && confirmPassword.length >= 6;
            var companyValid = companyName.length > 0;

            setFieldState(nameWrap, nameError, nameValid);
            setFieldState(emailWrap, emailError, emailValid);
            setFieldState(passwordWrap, passwordError, passwordValid);
            setFieldState(confirmPasswordWrap, confirmPasswordError, confirmValid);
            setFieldState(companyWrap, companyError, companyValid);

            if (!nameValid || !emailValid || !passwordValid || !confirmValid || !companyValid) {
                if (!nameValid) nameInput.focus();
                else if (!emailValid) emailInput.focus();
                else if (!passwordValid) passwordInput.focus();
                else if (!confirmValid) confirmPasswordInput.focus();
                else if (!companyValid) companyInput.focus();
                return;
            }

            registerBtn.disabled = true;
            registerBtn.classList.add('loading');
            btnLabel.textContent = 'جاري إنشاء الحساب...';
            messageDiv.className = 'message';
            messageDiv.innerHTML = '';

            var createdCompanyId = null;
            var createdUserId = null;

            try {
                console.log('📤 1. إنشاء المستخدم في Auth...');
                var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        autoRefreshToken: true,
                        persistSession: true,
                        detectSessionInUrl: true,
                        storageKey: 'rollex_session'
                    }
                });

                var { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name,
                            role: 'admin'
                        }
                    }
                });

                if (error) {
                    var errorMessage = error.message || 'حدث خطأ في إنشاء الحساب';
                    if (errorMessage.includes('already registered')) {
                        errorMessage = 'هذا البريد الإلكتروني مسجل بالفعل. يرجى استخدام بريد آخر.';
                    }
                    throw new Error(errorMessage);
                }

                if (!data.user) {
                    throw new Error('فشل إنشاء المستخدم');
                }

                createdUserId = data.user.id;
                console.log('✅ تم إنشاء المستخدم:', createdUserId);

                console.log('📤 2. إنشاء الشركة...');
                var newCompany = await createCompany(companyName);
                if (!newCompany) {
                    throw new Error('فشل إنشاء الشركة');
                }
                createdCompanyId = newCompany.id;
                console.log('✅ تم إنشاء الشركة:', createdCompanyId);

                console.log('📤 3. إنشاء البروفايل...');
                await createProfile(data.user.id, name, email, newCompany.id, companyName, 'admin');
                console.log('✅ تم إنشاء البروفايل');

                localStorage.setItem('rollex_session', JSON.stringify(data.session));
                console.log('✅ تم حفظ الجلسة');

                messageDiv.className = 'message success';
                messageDiv.innerHTML = '✅ تم إنشاء الحساب بنجاح! جاري التحويل...';

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ خطأ:', error);

                // التراجع (Rollback) - حذف أي بيانات اتنشأت
                if (createdUserId) {
                    console.log('🗑️ جاري حذف المستخدم (تراجع)...');
                    try {
                        await fetch(SUPABASE_URL + '/rest/v1/profiles?id=eq.' + createdUserId, {
                            method: 'DELETE',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': 'Bearer ' + getToken()
                            }
                        });
                    } catch (e) {
                        console.warn('⚠️ فشل حذف المستخدم:', e.message);
                    }
                }

                if (createdCompanyId) {
                    console.log('🗑️ جاري حذف الشركة (تراجع)...');
                    try {
                        await deleteCompany(createdCompanyId);
                    } catch (e) {
                        console.warn('⚠️ فشل حذف الشركة:', e.message);
                    }
                }

                messageDiv.className = 'message error';
                messageDiv.innerHTML = '⚠ ' + error.message;
            }

            registerBtn.disabled = false;
            registerBtn.classList.remove('loading');
            btnLabel.textContent = 'إنشاء الحساب';
        });

        console.log('📌 صفحة التسجيل - QuickData ProSoft (مع نظام التراجع)');
    </script>

</body>
</html>
